<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOMailer - Latihan 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style/style.css">
</head>
<body class="p-3 p-md-4">
  <div class="container-fluid max-width-lg">
    <div class="inbox-card">

      <div class="p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h1 class="brand-title m-0">DOMailer</h1>
          <div class="status-text">
            Unread: <strong id="unreadCount">0</strong> |
            Starred: <strong id="starredCount">0</strong> |
            Total: <strong id="totalCount">0</strong>
          </div>
        </div>

        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-5 col-lg-6">
            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search by sender or subject...">
          </div>
          <div class="col-12 col-md-7 col-lg-6 d-flex justify-content-md-end gap-1 flex-wrap">
            <button type="button" class="btn btn-sm btn-primary px-3 filter-btn active" data-filter="all">All</button>
            <button type="button" class="btn btn-sm btn-outline-primary px-3 filter-btn" data-filter="unread">Unread</button>
            <button type="button" class="btn btn-sm btn-outline-primary px-3 filter-btn" data-filter="starred">Starred</button>
            <button type="button" class="btn btn-sm btn-outline-primary px-3" data-bs-toggle="modal" data-bs-target="#composeModal">+ Compose</button>
          </div>
        </div>
      </div>

      <div class="selection-bar d-none align-items-center gap-2 flex-wrap" id="bulkActionBar">
        <span id="selectedCountText">0 item(s) selected</span>
        <button type="button" class="btn btn-sm btn-primary py-0 px-2 fs-7" id="markReadBtn">Mark as Read</button>
        <button type="button" class="btn btn-sm btn-danger py-0 px-2 fs-7" id="deleteSelectedBtn">Delete Selected</button>
      </div>

      <div class="table-responsive">
        <table class="table email-table align-middle">
          <thead>
            <tr>
              <th style="width: 40px;" class="text-center">
                <input class="form-check-input" type="checkbox" id="selectAllCheckbox" aria-label="Select all">
              </th>
              <th style="width: 40px;" class="text-center"><i class="bi bi-star"></i></th>
              <th style="width: 180px;">Sender</th>
              <th>Subject & Content</th>
              <th style="width: 100px;">Date</th>
              <th style="width: 80px;" class="text-center">Action</th>
            </tr>
          </thead>
          <tbody id="email-list">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Memuat data email...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <div class="modal fade" id="composeModal" tabindex="-1" aria-labelledby="composeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="composeForm">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="composeModalLabel">Compose Email</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="composeSender" class="form-label">Sender</label>
              <input type="text" class="form-control" id="composeSender" placeholder="Your name" required>
            </div>
            <div class="mb-3">
              <label for="composeSubject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="composeSubject" placeholder="Email subject" required>
            </div>
            <div class="mb-3">
              <label for="composeBody" class="form-label">Message</label>
              <textarea class="form-control" id="composeBody" rows="4" placeholder="Write your message..." required></textarea>
            </div>
            <p class="form-text mb-0">Subject containing <strong>URGENT</strong> or <strong>IMPORTANT</strong> will be tagged as high priority.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Send Email</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="deleteModalLabel">Hapus Email</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="deleteModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast align-items-center border-0 text-bg-success" id="appToast" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="appToastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
