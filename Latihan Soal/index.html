<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Bento Box</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header class="page-header">
        <h1>Japanese Bento Box</h1>
    </header>

    <main class="bento-container">
        <article class="box box-gohan">
            <span class="angka">01</span>
            <div class="box-text">
                <h2>Gohan / Main Rice</h2>
            </div>
        </article>
        <article class="box box-side">
            <span class="angka">02</span>
            <div class="box-text">
                <h2>Side Skewer</h2>
            </div>
        </article>
        <article class="box box-protein">
            <span class="angka">03</span>
            <div class="box-text">
                <h2>Okazu / Protein</h2>
            </div>
        </article>
        <article class="box box-dessert">
            <span class="angka">04</span>
            <div class="box-text">
                <h2>Tsukemono &amp; Dessert</h2>
            </div>
        </article>
    </main>
</body>
</html>
