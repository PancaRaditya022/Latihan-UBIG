<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode 34 - Kasir Warkop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h3 class="text-center text-primary fw-bold mb-4">☕ Kasir Warkop Terbuka</h3>

        <div class="row g-3 justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-primary text-white fw-bold">
                        Daftar Menu
                    </div>
                    <div class="card-body" id="areaMenu"></div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-success text-white fw-bold">
                        Daftar Belanja
                    </div>
                    <div class="card-body">
                        <div id="areaKeranjang"></div>
                        <div class="d-flex justify-content-between align-items-center mt-3 fw-bold">
                            <span>Total:</span>
                            <span id="totalHarga" class="text-success">Rp. 0</span>
                        </div>
                        <button class="btn btn-success w-100 mt-2" onclick="bayarSekarang()">Bayar Sekarang</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
