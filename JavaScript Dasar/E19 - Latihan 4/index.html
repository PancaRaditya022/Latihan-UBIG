<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode 19</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4" style="max-width: 500px;">
        <h3 class="mb-3">Episode 19 - Latihan Kalkulator</h3>

        <div class="mb-3">
            <label for="angka1" class="form-label">Angka pertama:</label>
            <input type="number" class="form-control" id="angka1">
        </div>

        <div class="mb-3">
            <label for="operator" class="form-label">Operator:</label>
            <input type="text" class="form-control" id="operator" placeholder="+ - * /">
        </div>

        <div class="mb-3">
            <label for="angka2" class="form-label">Angka kedua:</label>
            <input type="number" class="form-control" id="angka2">
        </div>

        <div class="mt-3 fw-bold"><span id="hasil">Hasil: </span></div>
        <br>
        
        <button type="button" id="button_hitung" class="btn btn-primary" onclick="calculate()">Hitung</button>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
