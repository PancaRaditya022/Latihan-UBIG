<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode 16</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row text-center mt-4">
            <h1>Episode 16 - Latihan Operator</h1>
        </div>

        <div class="row justify-content-center align-items-center mt-3 g-2">
            <div class="col-auto">
                <input type="number" class="form-control" id="angka1" placeholder="Angka 1">
            </div>
            <div class="col-auto">
                <select class="form-select" id="operator">
                    <option value="">Pilih Operator</option>
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                    <option value="%">%</option>
                    <option value="**">**</option>
                </select>
            </div>
            <div class="col-auto">
                <input type="number" class="form-control" id="angka2" placeholder="Angka 2">
            </div>
            <div class="col-auto">
                <button type="button" id="button_hitung" class="btn btn-primary">Hasil Hitung</button>
            </div>
            <div class="col-auto">
                <span id="hasil_hitung">Hasil</span>
            </div>
        </div>

        <div class="row justify-content-center align-items-center mt-3 g-2">
            <div class="col-auto">
                <input type="number" class="form-control" id="logika1" value="0">
            </div>
            <div class="col-auto">
                <select class="form-select" id="operator_logika">
                    <option value="and">and</option>
                    <option value="or">or</option>
                </select>
            </div>
            <div class="col-auto">
                <input type="number" class="form-control" id="logika2" value="1">
            </div>
            <div class="col-auto">
                <button type="button" id="button_logika" class="btn btn-primary">Hasil Logika</button>
            </div>
            <div class="col-auto">
                <span id="hasil_logika">0</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
