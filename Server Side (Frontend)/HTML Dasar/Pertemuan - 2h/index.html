<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
</head>

<body>
    <h1>Table HTML</h1>

    <h4>Tabel Standar</h4>
    <table border="1">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
    </table>

    <h4>Tabel Header</h4>
    <table border="1">
        <tr>
            <th>Jam</th>
            <th>Senin</th>
            <tr>
                <td>06:00</td>
                <td>Sekolah</td>
            </tr>
        </tr>
    </table>

    <h4>Table Gabungan</h4>
    <table border="1">
        <tr>
            <th>Jam</th>
            <th>Senin</th>
            <th>Selasa</th>
            <th>Rabu</th>
            <th>Kamis</th>
            <th>Jum'at</th>
            <tr>
                <th rowspan="2">06:30</th>
                <td colspan="5">Siap Siap</td>
            </tr>
            <tr>
                <td colspan="5">Berangkat Sekolah</td>
            </tr>
            <tr>
                <td rowspan="2">15:15</td>
                <td colspan="5">Pulang Sekolah</td>
            </tr>
    </table>
</body>

</html>
