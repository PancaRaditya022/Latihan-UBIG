<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
</head>

<body>
    <h1>Line Breaks dan Horizontal Rules</h1>

    <!-- Line Breaks -->
    <p>
        Paragraph dapat dibuat dengan menggunakan tag p,
        <br>
        lalu kita juga dapat membuat superscript dan subscript dengan sup dan sub.
    </p>
    <p>
        <b>April</b> adalah seorang Siswi yang sangat periang.
    </p>
    <hr>
    <p>
        <b>Winne</b> adalah sahabat terbaik April.
    </p>
</body>

</html>
