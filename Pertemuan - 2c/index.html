<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
</head>

<body>
    <h1>Strong, Emphasis, Blockquote</h1>

    <!-- Strong -->
     <p>
        <strong>Perhatian: </strong> MBG Di Stop Selama 2 Hari., <strong>Mohon Bersabar</strong>
     </p>

    <!-- Blockquote -->
    <Blockquote>
        Barang siapa yang mengonsumsi MBG niscaya ia adalah manusia sehat.
    </Blockquote>

    <!-- Emphasis dan Quote -->
     <p>
        Ini adalah <em>MBG</em> yang bergizi, bukan <em>MBG</em> yang beracun,. <q>Nikmatilah Selagi Disediakan.</q>
     </p>
</body>

</html>
